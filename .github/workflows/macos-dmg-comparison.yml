name: macOS DMG with Xcode 27.2

on:
  push:
    branches: [diagnose/macos-dmg-launch]

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/v0.20.1
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install the local build's Rust version
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0

      - name: Record build environment
        run: |
          git rev-parse HEAD
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          test "$(xcrun --sdk macosx --show-sdk-version)" = 27.2
          rustc -Vv

      - name: Build the shared frontend
        run: |
          npm ci
          npm run build -w apps/desktop
          node scripts/release/desktop-bundle-config.mjs desktop-build > "$RUNNER_TEMP/macos-bundle-config.json"

      - name: Build and verify the ARM64 installer
        run: |
          target=aarch64-apple-darwin
          node scripts/desktop/desktop-sidecar.mjs --target "$target"
          npm run -w apps/desktop tauri -- build \
            --target "$target" --bundles app,dmg \
            --config "$RUNNER_TEMP/macos-bundle-config.json"
          bundle="target/$target/release/bundle"
          dmgs=("$bundle"/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1
          test -f "${dmgs[0]}"
          app="$bundle/macos/Speclink.app"
          codesign --verify --deep --strict --all-architectures "$app"
          for executable in speclink-desktop speclink; do
            test "$(lipo -archs "$app/Contents/MacOS/$executable")" = arm64
          done
          hdiutil verify "${dmgs[0]}"
          shasum -a 256 "${dmgs[0]}"

      - uses: actions/upload-artifact@v4
        with:
          name: speclink-0.20.1-macos-arm64-xcode-27.2
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
