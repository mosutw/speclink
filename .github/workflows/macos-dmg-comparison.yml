name: macOS downloaded DMG startup

on:
  push:
    branches: [diagnose/macos-dmg-launch]

permissions:
  contents: read
  actions: read

jobs:
  launch:
    runs-on: xcode-27
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: 46154440262
          artifact-ids: 15267112937
          path: ${{ runner.temp }}/speclink-validation

      - name: Verify and copy the app from the exact DMG
        id: prepare
        run: |
          sw_vers
          cd "$RUNNER_TEMP/speclink-validation"
          dmg=Speclink_0.20.1_aarch64.dmg
          printf '%s  %s\n' 651cad7edf0e559de0022eb05d7491e29f31c453674d51edba0bcc4c50e4d4de "$dmg" | shasum -a 256 --check
          mountpoint="$(mktemp -d "$RUNNER_TEMP/speclink-dmg.XXXXXX")"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mountpoint" "$dmg"
          trap 'hdiutil detach "$mountpoint"' EXIT
          ditto "$mountpoint/Speclink.app" Speclink.app
          codesign --verify --deep --strict --all-architectures Speclink.app
          if xattr -p com.apple.quarantine Speclink.app >/dev/null 2>&1; then
            echo "App has download quarantine"
          else
            echo "App has no download quarantine"
          fi

      - name: Run the bundled CLI
        run: |
          cli="$RUNNER_TEMP/speclink-validation/Speclink.app/Contents/MacOS/speclink"
          result="$(perl -e 'alarm shift; exec @ARGV or die "$!\n"' 30 "$cli" --version)"
          printf '%s\n' "$result"
          grep -F '0.20.1' <<< "$result"

      - name: Confirm the app owns a visible window
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          cd "$RUNNER_TEMP/speclink-validation"
          cat > wait-for-window.swift <<'SWIFT'
          import AppKit
          import CoreGraphics
          import Foundation

          let expected = URL(fileURLWithPath: CommandLine.arguments[1]).resolvingSymlinksInPath()
          let deadline = Date().addingTimeInterval(45)
          repeat {
              guard let windows = CGWindowListCopyWindowInfo(
                  [.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID
              ) as? [[String: Any]] else {
                  print("No GUI window session is available")
                  exit(2)
              }

              let apps = NSRunningApplication.runningApplications(withBundleIdentifier: "app.speclink.desktop")
              for app in apps where app.isFinishedLaunching
                  && app.bundleURL?.resolvingSymlinksInPath() == expected {
                  for window in windows {
                      guard (window[kCGWindowOwnerPID as String] as? NSNumber)?.int32Value == app.processIdentifier,
                            (window[kCGWindowLayer as String] as? NSNumber)?.intValue == 0,
                            let bounds = window[kCGWindowBounds as String] as? [String: NSNumber],
                            let width = bounds["Width"]?.doubleValue, width >= 600,
                            let height = bounds["Height"]?.doubleValue, height >= 400
                      else { continue }
                      print("Speclink has a visible window \(Int(width))x\(Int(height)) (PID \(app.processIdentifier))")
                      exit(0)
                  }
              }

              Thread.sleep(forTimeInterval: 1)
          } while Date() < deadline

          print("Speclink did not show a visible window within 45 seconds")
          exit(1)
          SWIFT
          xcrun swiftc wait-for-window.swift -o wait-for-window
          perl -e 'alarm shift; exec @ARGV or die "$!\n"' 30 open -n "$PWD/Speclink.app"
          ./wait-for-window "$PWD/Speclink.app"

      - name: Read launch diagnostics on failure
        if: ${{ failure() && steps.prepare.outcome == 'success' }}
        run: |
          log show --last 4m --style compact --predicate 'process == "speclink-desktop" OR (process == "syspolicyd" AND eventMessage CONTAINS[c] "app.speclink.desktop")' | tail -60
